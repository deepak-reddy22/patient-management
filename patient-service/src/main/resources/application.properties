spring.application.name=patient-service

# Enable the development console; setting its path alone does not enable it.
# Spring Boot 4 also requires the spring-boot-h2console dependency.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# h2 is lightweight, open-source,fast RDBC
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.username=admin-viewer
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

server.port=4000

logging.level.root=info
